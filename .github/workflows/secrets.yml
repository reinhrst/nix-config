name: Secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so secrets pushed earlier are caught
      - uses: cachix/install-nix-action@v30
      - name: gitleaks (full history)
        run: nix run nixpkgs#gitleaks -- detect --config .gitleaks.toml --redact --no-banner
